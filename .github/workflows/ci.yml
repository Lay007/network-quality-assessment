name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-mysql php-snmp python3

      - name: Download Go modules
        run: go mod download

      - name: Test Go packages
        run: go test ./...

      - name: Test Go packages with coverage
        run: go test -cover ./...

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: test -z "$(gofmt -l cmd internal)"

      - name: Build service
        run: go build -o /tmp/Server_SFP_SLA_check ./cmd/server-sfp-sla

      - name: Lint shell scripts
        run: bash -n scripts/*.sh

      - name: Lint PHP files
        run: find web/htdocs -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check web asset links
        run: python scripts/check_web_links.py
