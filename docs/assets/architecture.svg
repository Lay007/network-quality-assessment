<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Network quality assessment architecture</title>
  <desc id="desc">Architecture diagram showing Linux measurement host, FPGA/SFP timestamp path, network under test, metrics engine and report output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="host" x1="0" x2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="hw" x1="0" x2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="report" x1="0" x2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1e293b"/>
    </marker>
    <style>
      .title{font:700 30px Arial,Helvetica,sans-serif;fill:#0f172a}.subtitle{font:400 15px Arial,Helvetica,sans-serif;fill:#475569}
      .box-title{font:700 17px Arial,Helvetica,sans-serif;fill:#0f172a}.box-text{font:400 13px Arial,Helvetica,sans-serif;fill:#334155}
      .lane-title{font:700 14px Arial,Helvetica,sans-serif;fill:#334155}.small{font:400 12px Arial,Helvetica,sans-serif;fill:#475569}
      .arrow{stroke:#1e293b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="560" rx="26" fill="url(#bg)"/>
  <text x="48" y="55" class="title">Hardware-assisted network quality assessment</text>
  <text x="48" y="82" class="subtitle">Custom IPv4 probes + timestamp-capable FPGA/SFP path + methodology-oriented SLA metrics</text>

  <rect x="40" y="125" width="470" height="310" rx="22" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="66" y="158" class="lane-title">Linux measurement host</text>
  <rect x="75" y="185" width="170" height="68" rx="15" fill="url(#host)" stroke="#60a5fa"/>
  <text x="98" y="213" class="box-title">CLI / Web UI</text>
  <text x="98" y="235" class="box-text">test profiles</text>
  <rect x="295" y="185" width="170" height="68" rx="15" fill="url(#host)" stroke="#60a5fa"/>
  <text x="320" y="213" class="box-title">Go generator</text>
  <text x="320" y="235" class="box-text">custom probe packets</text>
  <rect x="75" y="315" width="170" height="68" rx="15" fill="url(#host)" stroke="#60a5fa"/>
  <text x="105" y="343" class="box-title">Receiver</text>
  <text x="105" y="365" class="box-text">decode timestamps</text>
  <rect x="295" y="315" width="170" height="68" rx="15" fill="url(#host)" stroke="#60a5fa"/>
  <text x="321" y="343" class="box-title">Metrics engine</text>
  <text x="321" y="365" class="box-text">loss, delay, jitter</text>

  <rect x="610" y="125" width="520" height="310" rx="22" fill="#ffffff" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="636" y="158" class="lane-title">Timestamp-capable network path</text>
  <rect x="650" y="210" width="135" height="88" rx="16" fill="url(#hw)" stroke="#22c55e"/>
  <text x="675" y="242" class="box-title">FPGA/SFP A</text>
  <text x="676" y="266" class="box-text">T1 / T3</text>
  <rect x="835" y="210" width="135" height="88" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="866" y="242" class="box-title">Network</text>
  <text x="864" y="266" class="box-text">delay, jitter, loss</text>
  <rect x="1010" y="210" width="86" height="88" rx="16" fill="url(#hw)" stroke="#22c55e"/>
  <text x="1022" y="242" class="box-title">SFP B</text>
  <text x="1027" y="266" class="box-text">T2 / T4</text>

  <rect x="720" y="470" width="330" height="58" rx="16" fill="url(#report)" stroke="#f59e0b"/>
  <text x="754" y="493" class="box-title">CSV / acceptance report</text>
  <text x="754" y="515" class="box-text">RFC 2544 / Y.1564 oriented output</text>

  <path class="arrow" d="M245 219 H295"/>
  <path class="arrow" d="M465 219 C540 219 565 254 650 254"/>
  <path class="arrow" d="M785 254 H835"/>
  <path class="arrow" d="M970 254 H1010"/>
  <path class="arrow" d="M1010 300 C850 390 475 420 245 349"/>
  <path class="arrow" d="M245 349 H295"/>
  <path class="arrow" d="M465 349 C610 380 735 420 845 470"/>
  <path class="dash" d="M717 298 C690 350 555 368 465 349"/>
  <path class="dash" d="M1053 298 C925 365 640 376 465 349"/>

  <text x="530" y="207" class="small">custom IPv4 SLA probe</text>
  <text x="705" y="332" class="small">hardware timestamps</text>
  <text x="415" y="462" class="small">metrics are calculated from packet sequence, timestamp fields and received counters</text>
</svg>
