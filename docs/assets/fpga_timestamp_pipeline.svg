<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker><style>.t{font:700 28px Arial;fill:#0f172a}.s{font:400 15px Arial;fill:#475569}.b{font:700 15px Arial;fill:#0f172a}.p{font:400 12px Arial;fill:#334155}.l{stroke:#0f172a;stroke-width:2.4;marker-end:url(#a);fill:none}</style></defs><rect width="1180" height="520" rx="24" fill="#f8fafc"/><text x="42" y="55" class="t">FPGA/SFP timestamp insertion pipeline</text><text x="42" y="82" class="s">The timestamp point should be placed as close as possible to the deterministic datapath boundary</text><g><rect x="60" y="190" width="135" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="84" y="222" class="b">SFP PHY</text><text x="80" y="246" class="p">RX recovered data</text><rect x="245" y="190" width="135" height="82" rx="14" fill="#e0f2fe" stroke="#38bdf8"/><text x="265" y="222" class="b">MAC parser</text><text x="266" y="246" class="p">frame boundary</text><rect x="430" y="190" width="135" height="82" rx="14" fill="#dcfce7" stroke="#22c55e"/><text x="448" y="222" class="b">Timestamp</text><text x="455" y="246" class="p">T1/T2 latch</text><rect x="615" y="190" width="135" height="82" rx="14" fill="#fef3c7" stroke="#f59e0b"/><text x="636" y="222" class="b">Probe match</text><text x="638" y="246" class="p">test id / seq</text><rect x="800" y="190" width="135" height="82" rx="14" fill="#ede9fe" stroke="#8b5cf6"/><text x="824" y="222" class="b">Header edit</text><text x="820" y="246" class="p">write timestamp</text><rect x="985" y="190" width="135" height="82" rx="14" fill="#dbeafe" stroke="#60a5fa"/><text x="1010" y="222" class="b">TX path</text><text x="1004" y="246" class="p">forward frame</text></g><path class="l" d="M195 231H245"/><path class="l" d="M380 231H430"/><path class="l" d="M565 231H615"/><path class="l" d="M750 231H800"/><path class="l" d="M935 231H985"/><rect x="385" y="330" width="405" height="92" rx="16" fill="#fff" stroke="#cbd5e1"/><text x="415" y="360" class="b">Engineering note</text><text x="415" y="386" class="p">Pipeline latency is deterministic and can be removed by calibration.</text><text x="415" y="407" class="p">Remaining uncertainty is dominated by sync error and timestamp clock resolution.</text></svg>