<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#020617" flood-opacity=".14"/></filter>
    <style>.h{font:700 30px Arial;fill:#0f172a}.s{font:400 15px Arial;fill:#475569}.t{font:700 16px Arial;fill:#0f172a}.p{font:400 13px Arial;fill:#334155}.a{stroke:#0f172a;stroke-width:2.5;marker-end:url(#arrow);fill:none}.d{stroke:#64748b;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow);fill:none}.ts{font:700 14px Arial;fill:#0369a1}</style>
  </defs>
  <rect width="1180" height="500" rx="26" fill="#f8fafc"/>
  <text x="44" y="55" class="h">Probe packet flow</text><text x="44" y="82" class="s">Where the packet is created, timestamped, impaired by the network, received and converted into SLA metrics</text>
  <g filter="url(#shadow)">
    <rect x="60" y="160" width="155" height="90" rx="18" fill="#dbeafe" stroke="#60a5fa"/><text x="91" y="195" class="t">Service</text><text x="83" y="220" class="p">test id, seq, SLA</text>
    <rect x="270" y="160" width="155" height="90" rx="18" fill="#e0f2fe" stroke="#38bdf8"/><text x="304" y="195" class="t">Host TX</text><text x="294" y="220" class="p">raw packet send</text>
    <rect x="480" y="160" width="155" height="90" rx="18" fill="#dcfce7" stroke="#22c55e"/><text x="512" y="195" class="t">FPGA A</text><text x="511" y="220" class="ts">insert T1</text>
    <rect x="690" y="160" width="155" height="90" rx="18" fill="#f1f5f9" stroke="#94a3b8"/><text x="720" y="195" class="t">Network</text><text x="712" y="220" class="p">delay / jitter / loss</text>
    <rect x="900" y="160" width="155" height="90" rx="18" fill="#dcfce7" stroke="#22c55e"/><text x="932" y="195" class="t">FPGA B</text><text x="931" y="220" class="ts">insert T2</text>
  </g>
  <path class="a" d="M215 205H270"/><path class="a" d="M425 205H480"/><path class="a" d="M635 205H690"/><path class="a" d="M845 205H900"/>
  <path class="a" d="M980 250 C930 360 420 370 165 250"/><text x="505" y="368" class="p">return leg / received timestamped probe</text>
  <rect x="335" y="405" width="510" height="58" rx="16" fill="#fef3c7" stroke="#f59e0b"/><text x="410" y="429" class="t">Metrics engine: loss, one-way delay, jitter, throughput</text><text x="450" y="449" class="p">packet sequence + timestamp fields + counters</text>
  <path class="d" d="M558 250 C555 315 500 365 520 405"/><path class="d" d="M978 250 C950 330 760 370 695 405"/>
</svg>