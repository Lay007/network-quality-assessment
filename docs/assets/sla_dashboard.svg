<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">SLA dashboard</title>
  <desc id="desc">Template dashboard for latency, jitter, packet loss and timestamp confidence.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.14"/></filter>
    <style>.bg{fill:#f8fafc}.card{fill:url(#g);stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}.title{font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:800;fill:#0f172a}.note{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#475569}.h{font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.m{font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:800;fill:#14532d}.s{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#64748b}.axis{stroke:#94a3b8;stroke-width:1}.line{fill:none;stroke:#0f766e;stroke-width:4}.bar{fill:#86efac}.warn{fill:#fef3c7;stroke:#f59e0b;stroke-width:1.5}</style>
  </defs>
  <rect class="bg" width="1400" height="520" rx="28"/>
  <text class="title" x="56" y="58">SLA Measurement Dashboard</text>
  <text class="note" x="56" y="88">Report template for hardware-assisted latency, jitter, packet-loss and timestamp-confidence analysis</text>
  <g transform="translate(55,130)">
    <rect class="card" x="0" y="0" width="300" height="130" rx="20"/><text class="h" x="28" y="40">p99 latency</text><text class="m" x="28" y="85">TBD</text><text class="s" x="28" y="112">percentile-based SLA visibility</text>
    <rect class="card" x="330" y="0" width="300" height="130" rx="20"/><text class="h" x="358" y="40">RMS jitter</text><text class="m" x="358" y="85">TBD</text><text class="s" x="358" y="112">timing stability estimate</text>
    <rect class="card" x="660" y="0" width="300" height="130" rx="20"/><text class="h" x="688" y="40">Packet loss</text><text class="m" x="688" y="85">TBD</text><text class="s" x="688" y="112">isolated and burst events</text>
    <rect class="card" x="990" y="0" width="300" height="130" rx="20"/><text class="h" x="1018" y="40">Timestamp confidence</text><text class="m" x="1018" y="85">TBD</text><text class="s" x="1018" y="112">clock and origin assumptions</text>
  </g>
  <g transform="translate(95,360)">
    <text class="h" x="0" y="-96">Latency trend</text>
    <line class="axis" x1="0" y1="0" x2="560" y2="0"/><line class="axis" x1="0" y1="0" x2="0" y2="-110"/>
    <path class="line" d="M0 -35 C80 -55 130 -25 210 -60 S360 -70 430 -45 S520 -82 560 -70"/>
    <rect class="warn" x="640" y="-120" width="560" height="125" rx="18"/>
    <text class="h" x="670" y="-82">Engineering interpretation</text>
    <text class="s" x="670" y="-52">Correlate latency spikes with jitter, packet loss and timestamp uncertainty.</text>
    <text class="s" x="670" y="-28">Every SLA conclusion should reference the timing model and measurement origin.</text>
  </g>
</svg>
