<rect x="600" y="115" width="250" height="95" rx="16" fill="#111827" stroke="#334155"/><text x="622" y="150" font-family="Arial" font-size="14" fill="#94a3b8">Peak-to-peak jitter</text><text x="622" y="185" font-family="Arial" font-size="34" font-weight="700" fill="#facc15">42 us</text>
<rect x="880" y="115" width="250" height="95" rx="16" fill="#111827" stroke="#334155"/><text x="902" y="150" font-family="Arial" font-size="14" fill="#94a3b8">Packet loss</text><text x="902" y="185" font-family="Arial" font-size="34" font-weight="700" fill="#22c55e">0.02%</text>
<rect x="40" y="250" width="520" height="190" rx="18" fill="#111827" stroke="#334155"/><text x="65" y="282" font-family="Arial" font-size="17" font-weight="700" fill="#e5e7eb">Delay over time</text><polyline points="70,385 110,380 150,383 190,371 230,374 270,365 310,368 350,358 390,361 430,354 470,357 515,349" fill="none" stroke="#38bdf8" stroke-width="4"/><line x1="70" y1="400" x2="525" y2="400" stroke="#334155"/><line x1="70" y1="310" x2="70" y2="400" stroke="#334155"/><text x="72" y="425" font-family="Arial" font-size="12" fill="#94a3b8">0s</text><text x="498" y="425" font-family="Arial" font-size="12" fill="#94a3b8">60s</text><text x="85" y="330" font-family="Arial" font-size="12" fill="#94a3b8">hardware timestamped path</text>
<rect x="610" y="250" width="520" height="190" rx="18" fill="#111827" stroke="#334155"/><text x="635" y="282" font-family="Arial" font-size="17" font-weight="700" fill="#e5e7eb">Jitter distribution</text><rect x="675" y="370" width="24" height="35" fill="#facc15"/><rect x="715" y="345" width="24" height="60" fill="#facc15"/><rect x="755" y="315" width="24" height="90" fill="#facc15"/><rect x="795" y="295" width="24" height="110" fill="#facc15"/><rect x="835" y="330" width="24" height="75" fill="#facc15"/><rect x="875" y="360" width="24" height="45" fill="#facc15"/><line x1="660" y1="405" x2="1040" y2="405" stroke="#334155"/><text x="666" y="425" font-family="Arial" font-size="12" fill="#94a3b8">0</text><text x="1010" y="425" font-family="Arial" font-size="12" fill="#94a3b8">100 us</text>
<rect x="40" y="475" width="1090" height="175" rx="18" fill="#111827" stroke="#334155"/><text x="65" y="510" font-family="Arial" font-size="17" font-weight="700" fill="#e5e7eb">Acceptance summary</text><text x="70" y="552" font-family="monospace" font-size="15" fill="#e5e7eb">loss &lt;= 0.10%     delay &lt;= 1.000 ms     jitter &lt;= 100 us     throughput &gt;= 900 Mbit/s</text><text x="70" y="592" font-family="monospace" font-size="18" fill="#22c55e">PASS              PASS                 PASS                PASS</text><text x="70" y="628" font-family="Arial" font-size="14" fill="#94a3b8">The point of the benchmark is not only traffic generation, but timestamp-source-aware acceptance logic.</text>
