<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720">
<rect width="1180" height="720" rx="24" fill="#0b1220"/>
<text x="40" y="54" font-family="Arial" font-size="28" font-weight="700" fill="#e5e7eb">Benchmark run dashboard</text>
<text x="40" y="82" font-family="Arial" font-size="15" fill="#94a3b8">Demonstration dataset: 1G Ethernet SLA validation, 256B probes, FPGA/SFP timestamps</text>
