<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" viewBox="0 0 1180 520"><rect width="1180" height="520" rx="24" fill="#f8fafc"/><text x="40" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Custom probe packet layout</text><text x="40" y="82" font-family="Arial" font-size="15" fill="#475569">Wireshark-style view: IPv4 transport plus SLA measurement header and timestamp fields</text><g font-family="Arial" font-size="13"><rect x="60" y="150" width="160" height="80" fill="#dbeafe" stroke="#2563eb"/><text x="90" y="185" font-weight="700">IPv4 header</text><text x="92" y="207">20 bytes</text><rect x="220" y="150" width="130" height="80" fill="#e0f2fe" stroke="#0284c7"/><text x="245" y="185" font-weight="700">Magic</text><text x="250" y="207">0x53464C41</text><rect x="350" y="150" width="130" height="80" fill="#dcfce7" stroke="#16a34a"/><text x="380" y="185" font-weight="700">Test ID</text><text x="392" y="207">u32</text><rect x="480" y="150" width="130" height="80" fill="#fef3c7" stroke="#d97706"/><text x="505" y="185" font-weight="700">Seq</text><text x="515" y="207">u64</text><rect x="610" y="150" width="170" height="80" fill="#ede9fe" stroke="#7c3aed"/><text x="645" y="185" font-weight="700">Timestamp T1</text><text x="672" y="207">u64 ns</text><rect x="780" y="150" width="170" height="80" fill="#ede9fe" stroke="#7c3aed"/><text x="815" y="185" font-weight="700">Timestamp T2</text><text x="842" y="207">u64 ns</text><rect x="950" y="150" width="160" height="80" fill="#fee2e2" stroke="#dc2626"/><text x="1000" y="185" font-weight="700">Flags</text><text x="1004" y="207">u32</text></g><rect x="90" y="300" width="1000" height="140" rx="18" fill="#0f172a"/><text x="120" y="335" font-family="monospace" font-size="16" fill="#e5e7eb">Decoded probe packet</text><text x="120" y="370" font-family="monospace" font-size="15" fill="#38bdf8">sla.magic      = 0x53464C41</text><text x="120" y="396" font-family="monospace" font-size="15" fill="#