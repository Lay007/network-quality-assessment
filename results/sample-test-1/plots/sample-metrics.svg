<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Sample network-quality-assessment metrics</title>
  <desc id="desc">Summary chart for the committed sample test package with baseline delay, jitter, packet loss and throughput values.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c30"/>
    </linearGradient>
    <style>
      .bg { fill: url(#bg); }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; }
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 800; fill: #e5e7eb; }
      .note { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #94a3b8; }
      .k { font-family: Arial, Helvetica, sans-serif; font-size: 17px; fill: #94a3b8; }
      .v { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .line { stroke: #38bdf8; stroke-width: 4; fill: none; }
      .axis { stroke: #334155; stroke-width: 1; }
      .ok { fill: #22c55e; }
      .warn { fill: #facc15; }
      .muted { fill: #cbd5e1; font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="640" rx="28"/>
  <text class="title" x="42" y="58">Committed sample result package</text>
  <text class="note" x="42" y="86">Baseline network test with two SFP modules in a serial path</text>

  <rect class="card" x="42" y="120" width="250" height="110" rx="18"/>
  <text class="k" x="64" y="156">RTT avg</text>
  <text class="v" x="64" y="200">12.4 us</text>

  <rect class="card" x="320" y="120" width="250" height="110" rx="18"/>
  <text class="k" x="342" y="156">RTT max</text>
  <text class="v" x="342" y="200">16.8 us</text>

  <rect class="card" x="598" y="120" width="250" height="110" rx="18"/>
  <text class="k" x="620" y="156">Jitter</text>
  <text class="v" x="620" y="200">0.4 us</text>

  <rect class="card" x="876" y="120" width="282" height="110" rx="18"/>
  <text class="k" x="898" y="156">Throughput</text>
  <text class="v" x="898" y="200">9.8 Gbps</text>

  <rect class="card" x="42" y="270" width="560" height="220" rx="18"/>
  <text class="k" x="66" y="304">Directional delay view</text>
  <line class="axis" x1="72" y1="450" x2="562" y2="450"/>
  <line class="axis" x1="72" y1="330" x2="72" y2="450"/>
  <path class="line" d="M90 430 L180 404 L270 398 L360 392 L450 389 L540 388"/>
  <text class="muted" x="90" y="470">forward OWD: 6.1 us</text>
  <text class="muted" x="360" y="470">reverse OWD: 6.3 us</text>

  <rect class="card" x="634" y="270" width="524" height="220" rx="18"/>
  <text class="k" x="658" y="304">Acceptance snapshot</text>
  <text class="muted" x="662" y="352">Packet loss</text>
  <text class="ok" x="1040" y="352" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">0.0001%</text>
  <text class="muted" x="662" y="388">Path health</text>
  <text class="ok" x="1040" y="388" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PASS</text>
  <text class="muted" x="662" y="424">Interpretation</text>
  <text class="warn" x="662" y="456" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Concrete example artifact, not a calibrated production run</text>

  <rect class="card" x="42" y="520" width="1116" height="78" rx="18"/>
  <text class="muted" x="66" y="566">Use this file together with results/sample-test-1/summary.md and reports/sla_report.example.md when reviewing the repository.</text>
</svg>
